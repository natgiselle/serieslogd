<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale = 1.0"/>
        <!-- short for series logged as the name of the website-->
        <title>Serieslogd</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">      
        <link rel="stylesheet" href="style.css"/>
    </head>

    <body>
        <div class="container">

            <div id="logo">
                <h1>Serieslogd</h1>
            </div>

            <!-- search bar -->
            <div id="search-bar">
                <input id="search-bar-input" type="text" placeholder="Search...">
                <button id="search-bar-btn" type="button">
                    <i class="fa fa-search"></i>
                </button>
            </div> <!-- end of search-bar -->

            <div id="lists-row">
                <div id="watchlist">
                    <h2>My Watchlist</h2>
                    <div class="watchlist-card">
                        <!-- data pulled from TVmaze api soon -->
                        <img src="./src/sampleshow.jpg" width="100" alt="blank description">
                        <h3>Show name</h3> <!-- should have img -->

                        <div class="genre-yr-row">
                            <div class="genre">Genre</div>
                            <p> · </p>
                            <div class="year">Year</div>
                        </div> <!-- end of genre-yr-row -->
                        <div class="stars">
                            <p>8.9/10 <i class="fa fa-star"></i></p> 
                        </div>
                        <p>2 Seasons</p>
                    <!-- remove btn: #E08E45 (soft orange) or #D97C3D -->
                            <button type="button" class="remove-btn">Remove</button>
                    </div>
                </div> <!-- end of watchlist -->

                <div id="results">
                    <h2>Search Results</h2>
                    <div class="results-card">
                        <!-- data pulled from TVmaze api soon -->
                        <img src="./src/sampleshow.jpg" width="100" alt="blank description">
                        <h3>Show name</h3> <!-- should have img -->

                        <div class="genre-yr-row">
                            <div class="genre">Genre</div>
                            <p> · </p>
                            <div class="year">Year</div>
                        </div> <!-- end of genre-yr-row -->
                        <div class="stars">
                            <p>8.9/10 <i class="fa fa-star"></i></p> 
                        </div>
                        <p>2 Seasons</p>
                    <!-- remove btn: #E08E45 (soft orange) or #D97C3D -->
                            <button type="button" class= "add-btn">Add</button>
                    </div>
                <!-- add btn: #5FAE6E muted green or #00FF00 -->
                </div> <!-- end of search-results -->
            </div> <!-- end of lists-row -->
        </div> <!-- end of container-->

        <script src="script.js"></script>
    </body>
</html>
